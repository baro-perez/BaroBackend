services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: barogame
      POSTGRES_PASSWORD: game_dev_only
      POSTGRES_DB: barobackend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barogame -d barobackend"]
      interval: 5s
      retries: 10

volumes:
  pgdata: